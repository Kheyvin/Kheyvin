name: generate profile assets

on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

concurrency: { group: profile-assets, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    timeout-minutes: 15
    env:
      # Opcional: crea el secret STATS_TOKEN (PAT con scopes repo + read:user) para incluir repos privados
      TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      THEME: hide_border=true&bg_color=0b0b0e&title_color=FF0A2E&icon_color=FF3B5C&text_color=b8b8c2&ring_color=C8102E
    steps:
      - uses: actions/checkout@v7

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff0a2e&color_dots=#141417,#3a0a12,#7a0a1c,#c8102e,#ff3b5c
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#c8102e&color_dots=#ebedf0,#ffd1d8,#ff8096,#e01436,#8f0a1f

      - name: Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&${{ env.THEME }}
          path: dist/stats.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.THEME }}
          path: dist/top-langs.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Pin catastro_automatic
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=catastro_automatic&${{ env.THEME }}
          path: dist/pin-catastro_automatic.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Pin catastro_license
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=catastro_license&${{ env.THEME }}
          path: dist/pin-catastro_license.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Pin setterevoapi
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=setterevoapi&${{ env.THEME }}
          path: dist/pin-setterevoapi.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Pin course_animation_demo
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=course_animation_demo&${{ env.THEME }}
          path: dist/pin-course_animation_demo.svg
          token: ${{ env.TOKEN }}
          fail_on_error: "true"

      - name: Trophies + activity graph
        run: node .github/scripts/profile-cards.mjs "$GITHUB_REPOSITORY_OWNER" dist
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}

      # Reemplaza el contenido de la rama output con dist/ (si algún paso falla, se conserva la versión anterior)
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
