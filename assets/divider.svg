<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0a2e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff0a2e"/>
      <stop offset="50%" stop-color="#ffd6dd"/>
      <stop offset="65%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Línea angular estilo fragmento -->
  <polyline points="0,13 560,13 580,6 620,6 640,13 1200,13" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#s)" opacity=".8"/>
  <polyline points="0,13 560,13 580,6 620,6 640,13 1200,13" fill="none" stroke="url(#g)" stroke-width="2"/>
  <rect x="596" y="8" width="8" height="8" fill="#ff0a2e" transform="rotate(45 600 12)"/>
</svg>
