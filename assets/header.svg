<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Kheyvin — Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="60%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#1c0509"/>
    </linearGradient>

    <!-- Carbón para los fragmentos -->
    <linearGradient id="shardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c31"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="shardB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232327"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="shardRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1e3c"/>
      <stop offset="60%" stop-color="#8b0017"/>
      <stop offset="100%" stop-color="#2a0208"/>
    </linearGradient>

    <!-- Rojo neón que respira -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0a2e">
        <animate attributeName="stop-color" values="#ff0a2e;#ff3b5c;#c8102e;#ff0a2e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff3b5c">
        <animate attributeName="stop-color" values="#ff3b5c;#c8102e;#ff0a2e;#ff3b5c" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Destello que recorre la arista -->
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd6dd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0;1.2 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0a2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff0a2e" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 66px; letter-spacing: -1px; }
      .sub   { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 20px; fill: #b8b8c2; }
      .tag   { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 14px; fill: #ff3b5c; letter-spacing: 3px; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .breathe { animation: breathe 3.4s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .breathe2 { animation: breathe 3.4s ease-in-out infinite 1.1s; }
      .breathe3 { animation: breathe 3.4s ease-in-out infinite 2.2s; }
      .drift1 { animation: d1 10s ease-in-out infinite; }
      .drift2 { animation: d2 13s ease-in-out infinite; }
      @keyframes d1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-10px); } }
      @keyframes d2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-16px,8px); } }
      .glowPulse { animation: gp 5s ease-in-out infinite; }
      @keyframes gp { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
      .dash { stroke-dasharray: 14 10; animation: dash 2.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -48; } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- Resplandores rojos difusos -->
  <g filter="url(#blur)" class="glowPulse">
    <ellipse cx="980" cy="260" rx="260" ry="120" fill="url(#glowRed)"/>
    <ellipse cx="300" cy="40"  rx="220" ry="90"  fill="url(#glowRed)" opacity=".6"/>
  </g>

  <!-- Fragmentos de carbón (capa trasera) -->
  <g class="drift2">
    <polygon points="620,0 1200,0 1200,150 760,70" fill="url(#shardB)"/>
    <polygon points="0,320 380,320 270,288 0,296" fill="url(#shardB)"/>
    <polygon points="880,320 1200,320 1200,200 1040,250" fill="url(#shardA)"/>
  </g>

  <!-- Fragmentos de carbón (capa frontal) -->
  <g class="drift1">
    <polygon points="700,320 1200,320 1200,180 980,150 840,220" fill="url(#shardA)"/>
    <polygon points="0,0 340,0 230,50 0,62" fill="url(#shardA)" opacity=".9"/>
    <polygon points="560,320 760,320 1020,140 900,120" fill="url(#shardB)"/>
    <polygon points="640,0 900,0 820,60 700,40" fill="url(#shardB)" opacity=".8"/>
    <polygon points="1100,0 1200,0 1200,90" fill="url(#shardRed)" opacity=".7"/>
    <!-- Fragmento rojo brillante -->
    <polygon points="1060,320 1200,320 1200,230 1120,250" fill="url(#shardRed)" opacity=".9"/>
    <polygon points="860,200 1010,160 950,215" fill="url(#shardRed)" opacity=".85"/>
  </g>

  <!-- Aristas neón rojas (glow) -->
  <g fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)">
    <polyline class="breathe"  points="620,0 760,70 1200,150"/>
    <polyline class="breathe2" points="700,320 840,220 980,150 1200,180"/>
    <polyline class="breathe3" points="560,320 760,320 1020,140"/>
    <polyline class="breathe2" points="0,62 230,50 340,0"/>
    <polyline class="breathe"  points="0,296 270,288 380,320"/>
    <polyline class="breathe3" points="1040,250 1200,200"/>
    <line class="breathe" x1="860" y1="200" x2="1010" y2="160"/>
    <polyline class="breathe2" points="640,0 700,40 820,60 900,0"/>
    <line class="breathe3" x1="1100" y1="0" x2="1200" y2="90"/>
  </g>

  <!-- Destellos recorriendo aristas clave -->
  <g fill="none" stroke="url(#glint)" stroke-width="2" stroke-linecap="round" opacity=".9">
    <polyline points="700,320 840,220 980,150 1200,180"/>
    <polyline points="620,0 760,70 1200,150"/>
  </g>

  <!-- Finas líneas técnicas -->
  <g fill="none" stroke="#ff0a2e" stroke-opacity=".35" stroke-width="1">
    <line class="dash" x1="72" y1="252" x2="520" y2="252"/>
    <line x1="72" y1="80" x2="72" y2="262"/>
  </g>
  <rect x="68" y="76" width="8" height="8" fill="#ff0a2e" transform="rotate(45 72 80)" filter="url(#neonGlow)"/>
  <rect x="68" y="258" width="8" height="8" fill="#ff0a2e" transform="rotate(45 72 262)" filter="url(#neonGlow)"/>

  <!-- Texto -->
  <text class="tag" x="92" y="110">// BACKEND DEVELOPER @ KSPERU</text>
  <text class="title" x="90" y="180" fill="#f2f2f5" filter="url(#textGlow)">Kheyvin</text>
  <text class="title" x="90" y="180" fill="url(#neon)" opacity=".0">
    <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.45;.5;.55;1" dur="6s" repeatCount="indefinite"/>Kheyvin</text>
  <text class="sub" x="92" y="224">
    <tspan>$ building scalable APIs</tspan>
    <tspan class="cursor" fill="#ff0a2e">▌</tspan>
  </text>

  <!-- Barra neón animada -->
  <rect x="92" y="240" width="0" height="3" fill="url(#neon)" filter="url(#neonGlow)">
    <animate attributeName="width" values="0;400;400;0" keyTimes="0;.4;.8;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Borde -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#ff0a2e" stroke-opacity=".35"/>
</svg>
